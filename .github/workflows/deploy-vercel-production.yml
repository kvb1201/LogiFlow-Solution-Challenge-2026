# Deploy frontend to Vercel as the project owner (Hobby private-repo workaround).
#
# Why: Vercel blocks deployments when the Git commit author is not the Vercel
# team owner. This workflow rewrites the checked-out commit author, then
# deploys via the Vercel CLI using Kavya's token.
#
# Kavya must add GitHub repo secrets (one-time) — see docs/deployment.md
#
# Triggers:
#   - push to main → wait 10 min (debounce) → deploy
#   - every 10 min cron → deploy latest main (backup if a push deploy was skipped)
#   - manual workflow_dispatch
name: Deploy frontend to Vercel

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: vercel-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check required secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_GIT_EMAIL: ${{ secrets.VERCEL_GIT_EMAIL }}
          VERCEL_GIT_NAME: ${{ secrets.VERCEL_GIT_NAME }}
        run: |
          missing=0
          for key in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_GIT_EMAIL VERCEL_GIT_NAME; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing GitHub secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "Add secrets under GitHub → Settings → Secrets and variables → Actions"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait 10 minutes after push (debounce rapid commits)
        if: github.event_name == 'push'
        run: |
          echo "Waiting 10 minutes so multiple quick pushes only trigger one deploy..."
          sleep 600

      - name: Rewrite commit author for Vercel Hobby plan
        env:
          VERCEL_GIT_EMAIL: ${{ secrets.VERCEL_GIT_EMAIL }}
          VERCEL_GIT_NAME: ${{ secrets.VERCEL_GIT_NAME }}
        run: |
          git config user.email "$VERCEL_GIT_EMAIL"
          git config user.name "$VERCEL_GIT_NAME"
          git commit --amend --no-edit --reset-author
          echo "Author now: $(git log -1 --format='%an <%ae>')"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build for production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
